# Démo en ligne provisoire (tests par les collègues) sur Render : l'API (/api/v1) ; la base PostgreSQL est chez Neon.
# Le site web est sur Vercel (web/vercel.json) ; l'application mobile appelle directement https://….onrender.com.
# Données de DÉMONSTRATION uniquement (aucune donnée réelle de joueurs ou de mineurs).
# Mise en route : voir docs/DEMO_EN_LIGNE.md (Render › New › Blueprint › ce dépôt).
# Base de données : PostgreSQL chez Neon (neon.tech, gratuit, n'expire pas), plus sur Render (la base gratuite de Render
# est supprimée au bout de 30 jours). Adresse saisie à la main dans Render › Environment › DATABASE_URL : voir
# docs/DEMO_EN_LIGNE.md (« Base sur Neon »).
services:
  - type: web
    name: tcsay-demo
    runtime: node
    plan: free
    region: frankfurt
    branch: claude/tcsay-platform-dev-p3t75p
    # Pas de déploiement automatique à chaque push : déploiement manuel seulement (Render › Manual Deploy).
    autoDeploy: false
    # API seule : le site web est hébergé sur Vercel (web/vercel.json renvoie /api vers ce service).
    buildCommand: cd api && npm ci --include=dev && npm run build
    startCommand: cd api && npm run start:demo
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Africa/Tunis
      # Adresse « Direct connection » de Neon (avec ?sslmode=require) : secrète, jamais dans le dépôt.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Le site web est sur Vercel : l'API ne le sert pas.
      - key: SERVE_WEB
        value: "false"
      # Requêtes du site : navigateur → Vercel → Render (2 intermédiaires) pour lire l'IP réelle.
      - key: TRUST_PROXY_HOPS
        value: "2"
      # Comptes de démo partagés : mot de passe figé, pas de changement obligatoire
      - key: DEMO_MODE
        value: "true"
      # Mettre à true puis redéployer pour remettre les données de démo à zéro (puis remettre à false)
      - key: RESET_DEMO_DATA
        value: "false"
      # Emails : non configurés pour les tests (ils restent « Échec » dans Emails envoyés).
      # Emails : le plan gratuit bloque les ports SMTP (25, 465, 587). Régler MAIL_TRANSPORT=gmail-api (GMAIL_CLIENT_ID,
      # GMAIL_CLIENT_SECRET, GMAIL_REFRESH_TOKEN) ou brevo (BREVO_API_KEY), plus MAIL_FROM : voir docs/MAILING.md.
      # Alertes Telegram (docs/ALERTES_TELEGRAM.md) : valeurs secrètes saisies dans Render › Environment.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ALERT_INSTANCE
        value: TCSAY démo
      # Démo sans emails configurés : pas d'alerte à chaque email en échec.
      - key: ALERT_MAIL
        value: "false"

  # ─── Version du club (données réelles) : docs/VERSION_CLUB.md ──────────────────────────────────────────────────
  # Même code que la démo, sa propre base Neon (jamais celle de la démo) et seulement les modules validés.
  # Base vierge préparée une fois depuis votre PC : npm run db:init-prod (jamais de seed, jamais de migrate reset).
  - type: web
    name: tcsay-club
    runtime: node
    plan: free # pour le club : offre payante conseillée (pas de mise en veille)
    region: frankfurt
    branch: main # version stable du club : seulement ce qui est validé (docs/VERSION_CLUB.md)
    autoDeploy: false
    buildCommand: cd api && npm ci --include=dev && npm run build
    # Pas de migration au démarrage : sauvegarde puis migration depuis votre PC (npm run db:migrate).
    startCommand: cd api && npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Africa/Tunis
      # Base de production : le seed et les remises à zéro sont refusés.
      - key: TCSAY_PRODUCTION
        value: "true"
      # Modules validés pour le club : tous sauf ceux-ci (retirer une clé puis redémarrer pour rallumer un module).
      - key: MODULES_COUPES
        value: arabe,budget,disponibilites,evaluation-seances,bilans,exercices
      # Adresse « Direct connection » de la base Neon DU CLUB (secrète, jamais dans le dépôt).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Clé de chiffrement des mots de passe IJIN : à garder précieusement (perdue = mots de passe illisibles).
      - key: TCSAY_SECRET_KEY
        sync: false
      - key: SERVE_WEB
        value: "false"
      # Site du club : https://tcsay.vercel.app (projet Vercel « tcsay », branche club, VITE_API_URL = ce service).
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      # Le site appelle directement ce service (un seul intermédiaire : Render).
      - key: TRUST_PROXY_HOPS
        value: "1"
      # Emails en HTTPS (Render gratuit bloque SMTP) : mêmes valeurs que la démo si l'adresse d'envoi est la même.
      - key: MAIL_TRANSPORT
        value: gmail-api
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: Tennis Club de Sayada
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ALERT_INSTANCE
        value: TCSAY club
      # Lecture des photos du cahier par IA : clé Gemini (désactivée tant que le président ne l'a pas activée).
      - key: GEMINI_API_KEY
        sync: false
