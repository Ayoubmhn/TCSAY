name: tcsay

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tcsay
      POSTGRES_PASSWORD: tcsay
      POSTGRES_DB: tcsay
      TZ: Africa/Tunis
      PGTZ: Africa/Tunis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcsay -d tcsay"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      TZ: Africa/Tunis
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Interface web

volumes:
  pgdata:
  redisdata:
