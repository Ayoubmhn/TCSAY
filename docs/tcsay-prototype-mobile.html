<title>TCSAY Mobile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap">
<style>
/* Mise en page : un téléphone au centre (cadre sur ordinateur, plein écran sur téléphone), barre de choix d'espace au-dessus.
   Jetons repris du design system TCSAY (CLAUDE.md §9). */
:root {
  --bg: #fafafa; --fg: #1a1a1a; --mut: #8a8a8f; --card: #fff; --line: #e6e6ea; --fld: #f3f4f8; --btn: #ebebeb;
  --pri: #5a5acd; --sel: #0000e0; --dr: #f7f8fb; --day: #f1f2f6; --paid: #e9f7e1; --topay: #ffe8e8;
  --pb: #c9e9fb; --pg: #dff3a8; --pr: #fdb3b0; --ps: #f0d9a8; --ink: #111;
  --stage: #e9e9ef; --bezel: #1b1b1f; --overlay: rgba(0,0,0,.45); --danger: #c0392b; --ok: #3cb043;
  --font: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121212; --fg: #f2f2f2; --mut: #9a9aa0; --card: #1c1c1e; --line: #333; --fld: #26272b; --btn: #2e2e32;
  --dr: #17181b; --day: #2a2b30; --paid: #1f2e1a; --topay: #3a2224; --stage: #0b0b0d; --bezel: #000; --overlay: rgba(0,0,0,.6); --danger: #ff8a7a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121212; --fg: #f2f2f2; --mut: #9a9aa0; --card: #1c1c1e; --line: #333; --fld: #26272b; --btn: #2e2e32;
  --dr: #17181b; --day: #2a2b30; --paid: #1f2e1a; --topay: #3a2224; --stage: #0b0b0d; --bezel: #000; --overlay: rgba(0,0,0,.6); --danger: #ff8a7a; color-scheme: dark }

* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; background: var(--stage); color: var(--fg); font-family: var(--font); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--pri); outline-offset: 2px }
input, select, textarea { font: inherit; color: var(--fg) }

/* Barre au-dessus du téléphone */
.top { max-width: 900px; margin: 0 auto 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: center }
.top h1 { margin: 0; font-size: 17px; font-weight: 600; text-wrap: balance }
.top .demo { font-size: 12px; color: var(--mut) }
.seg { display: inline-flex; background: var(--btn); border-radius: 99px; padding: 3px; flex-wrap: wrap }
.seg button { padding: 7px 13px; border-radius: 99px; font-size: 13px; font-weight: 500 }
.seg button[aria-pressed="true"] { background: #222; color: #fff }

/* Téléphone */
.phone { width: 390px; max-width: 100%; height: 820px; max-height: calc(100vh - 110px); min-height: 560px; margin: 0 auto;
  border: 10px solid var(--bezel); border-radius: 48px; background: var(--bg); position: relative; overflow: hidden; display: flex; flex-direction: column }
@media (max-width: 460px) { body { padding-block: 10px } .phone { border-width: 0; border-radius: 22px; height: calc(100vh - 120px) } }
.status { height: 34px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; font-size: 13px; font-weight: 600 }
.screen { flex: 1; overflow-y: auto; padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 14px; scrollbar-width: none }
.screen::-webkit-scrollbar { display: none }
.screen > * { flex-shrink: 0 }
.tabs { flex: none; display: flex; border-top: 1.5px solid var(--line); background: var(--card); padding: 6px 4px 14px }
.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 500; color: var(--mut); padding: 4px 0; position: relative }
.tabs button[aria-current="page"] { color: var(--pri) }
.tabs svg { width: 23px; height: 23px }
.badge { position: absolute; top: 0; left: 52%; background: var(--pr); color: var(--ink); font-size: 10px; font-weight: 600; border-radius: 99px; padding: 1px 6px }

/* Typo */
.h1 { font-size: 23px; font-weight: 600; margin: 0; line-height: 1.25; text-wrap: balance }
.sub { color: var(--mut); margin: 4px 0 0; line-height: 1.45 }
.h2 { font-size: 17px; font-weight: 500; margin: 8px 0 0 }
.mut { color: var(--mut) }
.small { font-size: 13px }
.xs { font-size: 12px }
.num { font-variant-numeric: tabular-nums }

/* Composants */
.card { background: var(--card); border: 1.5px solid var(--line); border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 10px }
.card.tap { cursor: pointer }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px }
.row > :first-child { min-width: 0 }
.ct { font-size: 16px; font-weight: 500; margin: 0 }
.cs { font-size: 13px; font-weight: 600; color: var(--mut); margin: 0 }
.kpi { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums }
.pills { display: flex; flex-wrap: wrap; gap: 6px }
.pill { display: inline-block; border-radius: 99px; padding: 5px 13px; font-size: 13px; font-weight: 500; color: var(--ink); max-width: 100% }
.b { background: var(--pb) } .g { background: var(--pg) } .r { background: var(--pr) } .s { background: var(--ps) }
.btn { background: var(--pri); color: #fff; border-radius: 99px; padding: 13px 22px; font-weight: 600; align-self: flex-start }
.btn.full { align-self: stretch; text-align: center }
.btn2 { background: var(--btn); border-radius: 99px; padding: 10px 18px; font-size: 14px; font-weight: 500; align-self: flex-start }
.btn2.danger { background: var(--pr); color: var(--ink) }
.ico { width: 42px; height: 42px; border-radius: 50%; background: var(--btn); display: grid; place-items: center; flex: none }
.ico.p { background: var(--pri); color: #fff }
.ico svg { width: 20px; height: 20px }
.field { display: flex; flex-direction: column; gap: 6px }
.field label { font-size: 12px; font-weight: 500; color: var(--mut) }
.field input, .field select, .field textarea { background: var(--fld); border: 2px solid transparent; border-radius: 20px; padding: 12px 18px }
.field input:focus, .field textarea:focus { border-color: var(--pri); outline: 0 }
.chips { display: flex; gap: 8px; flex-wrap: wrap }
.chip { background: var(--fld); border-radius: 99px; padding: 9px 16px; font-size: 14px; font-weight: 500 }
.chip[aria-pressed="true"] { background: #222; color: #fff }
.note { background: var(--dr); border: 1.5px solid var(--line); border-radius: 18px; padding: 14px; font-size: 13px; color: var(--mut); line-height: 1.5 }
.empty { border: 1.5px dashed var(--line); border-radius: 24px; padding: 22px; text-align: center; color: var(--mut) }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden }
.bar i { display: block; height: 100%; background: var(--pri); border-radius: 99px }
.avatar { width: 40px; height: 40px; border-radius: 20px; background: var(--btn); display: grid; place-items: center; font-weight: 600; font-size: 14px; flex: none }
.avatar.big { width: 60px; height: 68px; border-radius: 22px; font-size: 20px; position: relative }
.avatar.big::after { content: ""; position: absolute; right: -2px; bottom: 4px; width: 14px; height: 14px; border-radius: 7px; background: var(--ok); border: 2px solid var(--bg) }
.list { padding: 4px 18px }
.mrow { display: flex; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1.5px solid var(--line); width: 100%; text-align: start; font-weight: 500 }
.mrow:last-child { border-bottom: 0 }
.mrow span:nth-child(2) { flex: 1 }
.mrow svg { width: 22px; height: 22px }
.soon { background: var(--ps); color: var(--ink); border-radius: 99px; font-size: 11px; padding: 3px 9px; font-weight: 600 }

/* Accueil */
.hero { border-radius: 36px; padding: 26px 26px 34px; color: #fff; position: relative; overflow: visible; min-height: 196px;
  background: linear-gradient(150deg, #14532d 0%, #2f7a4d 60%, #c2410c 100%); display: flex; flex-direction: column; gap: 12px }
.hero .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .12em; opacity: .85 }
.hero h2 { margin: 0; font-size: 23px; font-weight: 600 }
.notch { position: absolute; right: -6px; bottom: -6px; width: 78px; height: 78px; border-radius: 50%; background: var(--bg); display: grid; place-items: center }
.notch button { width: 58px; height: 58px; border-radius: 50%; background: var(--sel); color: #fff; font-size: 22px }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }

/* Jours */
.days { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px }
.day { flex: none; width: 54px; padding: 10px 0; border-radius: 20px; background: var(--day); display: flex; flex-direction: column; align-items: center; gap: 2px }
.day b { font-size: 17px; font-weight: 600 }
.day small { font-size: 12px; color: var(--mut); font-weight: 500 }
.day i { width: 5px; height: 5px; border-radius: 3px; background: transparent }
.day.dot i { background: var(--pri) }
.day[aria-pressed="true"] { background: var(--sel); color: #fff }
.day[aria-pressed="true"] small { color: #fff }
.day[aria-pressed="true"].dot i { background: #fff }

/* Tranches */
.tr { border-radius: 24px; padding: 18px; border: 1.5px solid var(--line); display: flex; flex-direction: column; gap: 12px }
.tr.paid { background: var(--paid) } .tr.due { background: var(--topay) }
.amounts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.amounts b { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums }

/* Grille de réservation */
.grid { display: grid; grid-template-columns: 50px repeat(4, 1fr); gap: 5px; font-size: 12px }
.grid .h { text-align: center; font-weight: 600; color: var(--mut); padding: 4px 0 }
.grid .t { color: var(--mut); font-weight: 500; display: flex; align-items: center; font-variant-numeric: tabular-nums }
.slot { border-radius: 12px; padding: 9px 2px; text-align: center; font-weight: 500; font-size: 11px; color: var(--ink) }
.slot.free { background: var(--pg) } .slot.taken { background: var(--pr) } .slot.off { background: var(--ps) }
.slot.mine { background: var(--sel); color: #fff }

/* Score */
.score { background: var(--card); border: 1.5px solid var(--line); border-radius: 24px; padding: 14px 18px; display: grid; grid-template-columns: 1fr repeat(3, 34px) 44px; gap: 6px 4px; align-items: center; font-variant-numeric: tabular-nums }
.score .n { font-weight: 600 }
.score .c { text-align: center; font-weight: 600 }
.score .pt { text-align: center; background: var(--pb); border-radius: 10px; padding: 3px 0; font-weight: 600; color: var(--ink) }
.srv { display: inline-block; width: 8px; height: 8px; border-radius: 4px; background: var(--ok); margin-inline-start: 6px }
.live { display: inline-flex; align-items: center; gap: 6px }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 4px; background: #e53935; animation: blink 1.4s infinite }
@keyframes blink { 50% { opacity: .25 } }
@media (prefers-reduced-motion: reduce) { .live::before { animation: none } }

/* Notation */
.stars { display: flex; gap: 6px }
.stars button { width: 36px; height: 36px; border-radius: 12px; background: var(--fld); font-weight: 600 }
.stars button[aria-pressed="true"] { background: var(--pri); color: #fff }

/* Feuilles et toasts */
.veil { position: absolute; inset: 0; background: var(--overlay); display: flex; align-items: flex-end; z-index: 5 }
.sheet { background: var(--card); width: 100%; border-radius: 28px 28px 0 0; padding: 18px 20px 26px; display: flex; flex-direction: column; gap: 12px; max-height: 88%; overflow-y: auto }
.grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); align-self: center }
.toast { position: absolute; left: 50%; bottom: 92px; transform: translateX(-50%); background: var(--fg); color: var(--bg); border-radius: 99px; padding: 12px 20px; font-size: 14px; font-weight: 500; max-width: 88%; text-align: center; z-index: 9 }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--pri); font-weight: 500; font-size: 14px; align-self: flex-start; padding: 2px 0 }
.chart { width: 100%; height: auto; display: block }
.chart text { fill: var(--mut); font-size: 10px; font-family: var(--font) }
</style>

  <h1>TCSAY Mobile · prototype</h1>
  <div class="seg" role="group" aria-label="Voir l’application comme">

<script>

/* ───── Rendu ───── */
const $screen = document.getElementById('screen');
const $tabs = document.getElementById('tabs');
const $phone = document.getElementById('phone');
let toastTimer;
function toast(m) {
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = m; $phone.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3500);
}
function sheet(title, body, onMount) {
  closeSheet();
  const v = document.createElement('div'); v.className = 'veil';
  v.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grip"></div><div class="row"><b style="font-size:18px">${title}</b><button class="btn2" data-close>Fermer</button></div>${body}</div>`;
  v.addEventListener('click', (e) => { if (e.target === v || e.target.closest('[data-close]')) closeSheet(); });
  $phone.appendChild(v); onMount?.(v.querySelector('.sheet'));
}
function closeSheet() { document.querySelector('.veil')?.remove(); }

function go(tab, sub = null) { S.tab = tab; S.sub = sub; render(); $screen.scrollTop = 0; }

function render() {
  document.querySelectorAll('.seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.role === S.role)));
  if (S.role === 'login') { $tabs.hidden = true; $screen.innerHTML = vLogin(); return bind(); }
  $tabs.hidden = false;
  const tabs = TABS[S.role];
  if (!S.tab) S.tab = tabs[0][0];
  const unread = D.notifs.filter((n) => n.unread).length;
  $tabs.innerHTML = tabs.map(([k, l, i]) => `<button data-go="${k}" ${S.tab === k ? 'aria-current="page"' : ''}>${ic(i)}${l}${k === 'alertes' && unread ? `<span class="badge">${unread}</span>` : ''}</button>`).join('');
  const V = VIEWS[S.tab] ?? VIEWS.soon;
  $screen.innerHTML = V();
  bind();
}

function vReserver() {
  const courts = ['Court 1 ☀', 'Court 2 ☀', 'Court 3', 'Court 4 ☀'];
  const hours = ['16:00', '16:30', '17:00', '17:30', '18:00 ☾', '18:30 ☾', '19:00 ☾', '19:30 ☾'];
  const taken = { '0-2': 1, '0-3': 1, '1-0': 1, '1-1': 1, '1-2': 1, '1-3': 1, '3-6': 1, '3-7': 1 };
  const b = S.booking;
  const cells = hours.map((h, hi) => `<span class="t">${h}</span>` + courts.map((c, ci) => {
    const key = `${ci}-${hi}`;
    const off = ci === 2 && hi >= 4;
    const mine = b && b.c === ci && hi >= b.h && hi < b.h + b.len;
    const cls = mine ? 'mine' : off ? 'off' : taken[key] ? 'taken' : 'free';
    const label = mine ? 'Choisi' : off ? 'Sans éclairage' : taken[key] ? 'Pris' : 'Libre';
    return `<button class="slot ${cls}" ${cls === 'free' || cls === 'mine' ? `data-slot="${ci}-${hi}"` : 'disabled'} aria-label="${c} ${h} : ${label}">${off ? '☾' : taken[key] ? 'Pris' : mine ? '✓' : 'Libre'}</button>`;
  }).join('')).join('');
  const price = b ? b.len * 0.5 * (hours[b.h].includes('☾') ? 20 : 15) : 0;
  return `${header(S.role === 'coach' ? 'Réserver (séances privées)' : 'Réserver un terrain', 'Choisissez le jour, puis une demi-heure libre : 1 h par défaut, touchez la suivante pour prolonger.')}

    ${days([])}

    <div class="pills">${pill('Libre', 'g')}${pill('Pris', 'r')}${pill('Sans éclairage', 's')}${pill('☾ nuit dès 18h', 'b')}</div>
    ${b ? `<div class="card"><p class="cs">Récapitulatif</p><div class="pills">${pill(courts[b.c].replace(' ☀', ''), 'g')}${pill(hours[b.h].replace(' ☾', '') + ' · ' + (b.len * 30) + ' min', 'b')}</div><div class="row"><span class="kpi">${DT(price)}</span><button class="btn" data-book>Réserver</button></div></div>` : '<div class="empty">Touchez une case « Libre » pour choisir un créneau.</div>'}
    <h3 class="h2">Mes réservations</h3>
    <div class="card"><div class="row"><p class="ct">Court 4</p>${pill('Confirmée', 'g')}</div><div class="pills">${pill('sam. 17 oct.', 'b')}${pill('10:00 – 11:00', 'b')}</div><button class="btn2 danger" data-cancel>Annuler</button></div>
    <div class="note">Annulation possible jusqu’à 24 h avant le créneau. Tarifs jour / nuit de démonstration.</div>`;
}

function vSuivi() {
  const k = kid();
  const pts = [3.2, 3.5, 3.4, 3.8, 3.7, k.avg];
  const W = 300, H = 120, x = (i) => 20 + i * (W - 40) / 5, y = (v) => H - 20 - (v - 1) / 4 * (H - 36);
  const line = pts.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  return `${back('menu', 'Menu')}${header('Suivi et progression', 'Assiduité, notes des séances et bilans de l’entraîneur.')}${kidChips()}
    <div class="two"><div class="card"><p class="cs">Assiduité</p><span class="kpi">${k.attendance} %</span><span class="small mut">depuis septembre</span></div><div class="card"><p class="cs">Moyenne du mois</p><span class="kpi">${k.avg.toFixed(1).replace('.', ',')}/5</span>${pill('↗ en hausse', 'g')}</div></div>
    <div class="card"><p class="cs">Note moyenne par semaine</p>
      <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe des notes, de 3,2 à ${k.avg}">
        ${[1, 3, 5].map((v) => `<line x1="20" x2="${W - 20}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="4" y="${y(v) + 3}">${v}</text>`).join('')}
        <path d="${line} L${x(5)} ${H - 20} L${x(0)} ${H - 20} Z" fill="var(--pri)" opacity=".12"/>
        <path d="${line}" fill="none" stroke="var(--pri)" stroke-width="2.5" stroke-linejoin="round"/>
        <circle cx="${x(5)}" cy="${y(k.avg)}" r="4.5" fill="var(--pri)"/>
        ${['S1', 'S2', 'S3', 'S4', 'S5', 'S6'].map((l, i) => `<text x="${x(i) - 6}" y="${H - 4}">${l}</text>`).join('')}

/* ───── Interactions ───── */
function bind() {
  document.getElementById('loginForm')?.addEventListener('submit', (e) => { e.preventDefault(); S.role = 'parent'; S.tab = null; render(); toast('Connecté · espace Parent'); });
  const q = document.getElementById('jq');
  q?.addEventListener('input', () => { const v = q.value.toLowerCase(); document.querySelectorAll('#jlist [data-player]').forEach((c) => { c.hidden = !c.dataset.player.toLowerCase().includes(v) && !c.textContent.toLowerCase().includes(v); }); });
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('button, [data-go], [data-player]');
  if (!t) return;
  const d = t.dataset;
  if (d.role) { S.role = d.role; S.tab = null; S.booking = null; closeSheet(); return render(); }
  if (d.roleSwitch) { S.role = d.roleSwitch; S.tab = null; closeSheet(); render(); return toast(d.roleSwitch === 'login' ? 'Déconnecté' : 'Espace ' + (USER[d.roleSwitch]?.[3] ?? '')); }
  if (d.toast) toast(d.toast);
  if (d.go) { if (d.go === 'soon') { S.tab = 'soon'; S.sub = d.label; render(); $screen.scrollTop = 0; return; } return go(d.go); }
  if (d.kid) { S.kid = d.kid; return render(); }
  if (d.day !== undefined) { S.day = +d.day; return render(); }
  if (d.nf) { S.notifFilter = d.nf; return render(); }
  if (d.read !== undefined) { D.notifs[+d.read].unread = 0; render(); return toast('Marquée comme lue.'); }
  if (d.readall !== undefined) { D.notifs.forEach((n) => (n.unread = 0)); render(); return toast('Toutes les notifications sont lues.'); }
  if (d.slot) { const [c, h] = d.slot.split('-').map(Number); const b = S.booking; if (b && b.c === c && h === b.h + b.len && b.len < 8) b.len++; else if (b && b.c === c && h >= b.h && h < b.h + b.len) S.booking = null; else S.booking = { c, h, len: 2 }; return render(); }
  if (d.book !== undefined) { S.booking = null; render(); return toast('Réservation confirmée. Un email de confirmation est envoyé.'); }
  if (d.cancel !== undefined) return sheet('Annuler la réservation ?', '<span class="mut">Court 4 · samedi 17 octobre · 10:00. Annulation possible jusqu’à 24 h avant.</span><div class="row"><button class="btn2" data-close>Garder</button><button class="btn2 danger" data-close data-toast="Réservation annulée.">Annuler la réservation</button></div>');
  if (d.mark) { const [n, v] = d.mark.split('|'); S.marks[n] = v; return render(); }
  if (d.rate !== undefined) return rateSheet();
  if (d.pt) { const L = S.live, order = ['0', '15', '30', '40']; const me = d.pt === 'a' ? 'pa' : 'pb', ot = d.pt === 'a' ? 'pb' : 'pa'; const i = order.indexOf(L[me]); if (i < 3) L[me] = order[i + 1]; else { L[d.pt][2]++; L.pa = '0'; L.pb = '0'; L.srv = L.srv === 'a' ? 'b' : 'a'; toast('Jeu ' + (d.pt === 'a' ? 'Yassine' : 'Karim')); } if (L[ot] === undefined) L[ot] = '0'; return render(); }
  if (d.pay) return paySheet(d.pay);
  if (d.player) return playerSheet(d.player);
  if (d.themeSet) { S.dark = d.themeSet === 'system' ? null : d.themeSet; if (S.dark) document.documentElement.dataset.theme = S.dark; else delete document.documentElement.dataset.theme; return render(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
render();
</script>
