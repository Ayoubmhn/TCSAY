# Vérification automatique à chaque push : compilation de l'API et du site, contrôles (score, Web Push,
# alertes) et 551 tests de bout en bout sur une base PostgreSQL de démo, vide, créée pour l'occasion (jamais la vraie).
# Résultat : coche verte ou croix rouge sur le commit dans GitHub, et email en cas d'échec.
name: Tests

# Une seule fois par commit : à chaque push (toutes les branches) ; une pull request reprend le résultat du push.
on:
  push:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (compilation et tests de bout en bout)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tcsay
          POSTGRES_PASSWORD: tcsay
          POSTGRES_DB: tcsay_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tcsay" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Base de démonstration jetable (supprimée à la fin du job) : identifiants sans valeur secrète.
      DATABASE_URL: postgresql://tcsay:tcsay@localhost:5432/tcsay_ci?schema=public
      E2E_DATABASE_URL: postgresql://tcsay:tcsay@localhost:5432/tcsay_ci?schema=public
      E2E_API: http://localhost:3000/api/v1
      JWT_SECRET: secret-de-test-ci-uniquement
      RATE_LIMIT_PER_MINUTE: '100000'
      TZ: Africa/Tunis
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Base de démo (migrations + données fictives)
        run: npx prisma migrate deploy && npx prisma generate && npx prisma db seed
      - run: npm run build
      - name: Contrôles sans serveur (score, Web Push)
        run: npm run test:score && npm run test:push
      - name: Alertes Telegram (faux serveur Telegram local)
        run: npm run test:alerts
      - name: Version du club (modules coupés → 404)
        run: npm run test:modules
      - name: Lancement de l'API
        run: |
          nohup node dist/main > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf "$E2E_API/health" > /dev/null && exit 0; sleep 1; done
          cat api.log; exit 1
      - name: Tests de bout en bout
        run: npm run test:e2e
      - name: Journal de l'API (en cas d'échec)
        if: failure()
        run: tail -n 200 api.log || true

  web:
    name: Site web (compilation)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
