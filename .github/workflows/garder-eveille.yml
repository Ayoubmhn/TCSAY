# Garde l'API du club éveillée en journée (hébergement Render gratuit : mise en veille après 15 min sans visite, puis
# 30 à 60 s d'attente à la première ouverture). Un appel à /api/v1/health toutes les 10 minutes, de 7 h à 23 h (heure
# de Tunis, UTC+1). La nuit, le serveur peut dormir : les heures gratuites de Render (750 h par mois pour tout le compte)
# suffisent ainsi pour le club ; la démo n'est pas réveillée (elle dort entre deux visites).
# GitHub ne lance les tâches planifiées que depuis la branche par défaut (main), parfois avec quelques minutes de
# retard ; elles s'arrêtent après 60 jours sans activité sur le dépôt (Actions › réactiver).
name: Garder l'API du club éveillée

on:
  schedule:
    - cron: '*/10 6-21 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Appel de /api/v1/health (club)
        run: curl -fsS --max-time 90 --retry 2 https://tcsay-club.onrender.com/api/v1/health || echo "API injoignable (réveil en cours ?)"
